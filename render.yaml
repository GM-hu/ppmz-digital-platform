services:
  - type: web
    name: ppmz-digital-platform
    runtime: node
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PPMZ_ADMIN_USERNAME
        sync: false
      - key: PPMZ_ADMIN_PASSWORD
        sync: false
    disk:
      name: ppmz-data
      mountPath: /opt/render/project/src/data
      sizeGB: 1
